[package]
name = "physio-algo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Brand-neutral physiological algorithms (sleep staging, HRV, PPG, SpO2, recovery, strain, calibration). Plain-value inputs plus decoded-record history adapters; no wire codec, no BLE, no IO. Outputs are wellness estimates, never medical."

[dependencies]
whoop-protocol.workspace = true

[dev-dependencies]
serde_json = "1"
# Examples only: the corpus harnesses read a real .noopbak store, so a measurement uses the shipped
# turn()/posture() rather than a second copy of the formula written in the harness.
rusqlite = { version = "0.32", features = ["bundled"] }
