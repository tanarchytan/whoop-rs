# Sleep A-Z figure manifest: every number the documents quote, paired with the command that prints it.
#
# Read by `az_sweep.py`. One `[[run]]` per harness (its example, its dataset, why it exists); one
# `[[figure]]` per quoted number (which run prints it, which document and section carries it, the
# documented value, and the regex that extracts the actual one - capture group 1 IS the value).
#
# A figure with no `pattern` is UNREPRODUCIBLE: no committed command regenerates it. That is reported,
# never passed, because a number nobody can regenerate is how this project accumulated facts that later
# turned out to be wrong. Say WHY in `note`.
#
# Adding a figure to a document means adding it here in the same pass. The sweep is then one command.
#
# SCOPE: every `doc` here resolves against `dev-notes/noop-tan`, so this sheet covers the A-Z working
# notes only. Figures published in `whoop-rs/docs/` are NOT registered here and must not be: they are
# pinned by `docs-vs-code.py`, which re-derives each one from the source or from a cargo run, whereas a
# row here would only assert the number appears in some text. Teaching this file a second doc root would
# duplicate the weaker half of a check that already exists, so the three staging kappas in
# `algorithms.md` stay where the stronger gate holds them. It is a deliberate boundary, not a gap, and
# it does not add to the unreproducible count below.

[meta]
version = "1.0.0"
cargo_root = "whoop-rs"
# The de-duplicated corpus, both rules applied. Built by grafting onto the pinned fixtures_multi_clean,
# never rebuilt from the raw root: that has since been rebuilt from newer backups (2,140.5 h against the
# pinned 2,113 h), so a rebuild from it is a DIFFERENT corpus.
fixtures = "sleep-benchmark/fixtures_multi_clean3"

# ─────────────────────────────────────────── the runs ───────────────────────────────────────────

[[run]]
